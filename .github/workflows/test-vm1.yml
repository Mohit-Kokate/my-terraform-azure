name: Project 1 - test-vm
on:
  push:
    branches:
      - feature-add-vm        # Runs automatically on a code push to your test branch
  workflow_dispatch:          # Enables the manual web button on GitHub

jobs:
  deploy-windows-vm:
    runs-on: ubuntu-latest
    steps:
    # 1. Pull the infrastructure code files directly from your current branch workspace
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Securely log into your Microsoft Azure account using your manual repository secret
    - name: Azure Login Authentication
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}                  # <--- Reads your manually added JSON block safely

    # 3. Setup the HashiCorp Terraform engine
    - name: Setup Terraform CLI
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.10.0"                              

    # 4. Initialize plugins inside your root repository folder
    - name: Terraform Init
      run: terraform init

    # 5. Build and deploy the Windows VM to Azure
    - name: Terraform Apply (Live Cloud Build)
      run: terraform apply -auto-approve                         # <--- Bypasses manual terminal "yes" prompts for full automation [HashiCorp]
            

name: test-vm

on:
  push:
    branches:
      - feature-add-vm        # Runs automatically when you push to your test branch
  workflow_dispatch:          # Allows you to click the gray web button manually

jobs:
  deploy-windows-vm:
    runs-on: ubuntu-latest
    steps:
    # 1. Pull the code from your feature branch
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Securely log into your Microsoft Azure account
    - name: Azure Login Authentication
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 3. Setup the HashiCorp Terraform binary engine
    - name: Setup Terraform CLI
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.10.0"

    # 4. Initialize plugins and infrastructure targets
    - name: Terraform Init
      working-directory: my-terraform-azure
      run: terraform init

    # 5. Build and deploy the Windows VM to Azure
    - name: Terraform Apply (Live Cloud Build)
      working-directory: my-terraform-azure
      run: terraform apply -auto-approve

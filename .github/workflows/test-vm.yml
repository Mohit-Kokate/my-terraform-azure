name: Test-vm

on:
  push:
    branches:
      - feature-add-vm        # Runs automatically on a code push to your test branch
  workflow_dispatch:          # Enables the manual web button on GitHub

jobs:
  deploy-windows-vm:
    runs-on: ubuntu-latest
    steps:
    # 1. Pull the workflow configuration file from your current repository
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    # 2. Fetch your infrastructure files from your OTHER secret repository
    - name: Fetch Infrastructure Code From Secret Repo
      uses: actions/checkout@v4
      with:
        repository: 'Mohit-Kokate/my-terraform-azure'   # <--- Change YOUR_GITHUB_USERNAME to your actual GitHub username
        token: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}           # <--- Reads the access token from your repo secrets
        path: 'my-terraform-azure'                               # <--- Dynamically creates this folder name on the cloud runner

    # 3. Securely log into your Microsoft Azure account
    - name: Azure Login Authentication
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}                  # <--- Reads your Azure Service Principal credentials JSON

    # 4. Setup the HashiCorp Terraform engine
    - name: Setup Terraform CLI
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.10.0"                              # <--- Sets a rock-solid, stable engine version

    # 5. Initialize inside your dynamically matched path folder
    - name: Terraform Init
      working-directory: my-terraform-azure                      # <--- Jumps into your repository path folder automatically [HashiCorp]
      run: terraform init

    # 6. Build and deploy the Windows VM to Azure
    - name: Terraform Apply (Live Cloud Build)
      working-directory: my-terraform-azure                      # <--- Jumps into your repository path folder automatically [HashiCorp]
      run: terraform apply -auto-approve                         # <--- Bypasses manual terminal "yes" inputs for full automation [HashiCorp]
